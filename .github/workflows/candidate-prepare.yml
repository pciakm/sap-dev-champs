name: Release | Hotfix candidate prepare

on: 
  workflow_dispatch:
    inputs:
      branch_type:
        type: choice
        description: Branch type
        required: true
        options:
          - release
          - hotfix

permissions:
  contents: write
  packages: read

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}       

jobs:
    validate-branch:      
      runs-on: ubuntu-latest
      steps:
      - name: Validate branch
        env:
          BRANCH_TYPE: ${{ github.event.inputs.branch_type }}
          CURRENT_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "${BRANCH_TYPE}" == "release" && "${CURRENT_BRANCH}" != "dev" ]]; then
            echo "::error title=Invalid branch::For ${BRANCH_TYPE} this workflow can only be triggered on the dev branch. Current branch: ${CURRENT_BRANCH}."
            exit 1
          elif [[ "${BRANCH_TYPE}" == "hotfix" && "${CURRENT_BRANCH}" != "main" ]]; then
            echo "::error title=Invalid branch::For ${BRANCH_TYPE} this workflow can only be triggered on the main branch. Current branch: ${CURRENT_BRANCH}."
            exit 1
          fi          

    prepare-branch-and-tag:     
        runs-on: ubuntu-latest
        needs: validate-branch
        steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '24'
            registry-url: 'https://npm.pkg.github.com'
            scope: '@knauf-group'

        - name: Install dependencies
          run: npm ci
      
        - name: Set candidate version
          run: |
            PKG_VER=$(node -p "require('./package.json').version")            
            echo "PKG_VER=$PKG_VER"
            echo "PKG_VER=$PKG_VER" >> $GITHUB_ENV                

        - name: Create new branch if not exists
          env: 
            PKG_VER: ${{ env.PKG_VER }}
            BRANCH_TYPE: ${{ github.event.inputs.branch_type }}
            GITHUB_REF_NAME: ${{ github.ref_name }}
            GITHUB_ACTOR: ${{ github.actor }}
          run: |
            bash .github/workflows/scripts/create_candidate_branch.sh                 

        - name: Create candidate tag if changes applied
          env:
            PKG_VER: ${{ env.PKG_VER }} 
            BRANCH_TYPE: ${{ github.event.inputs.branch_type }}
          run: |
            bash .github/workflows/scripts/create_candidate_tag_if_changes_applied.sh        